    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Roboto+Mono:wght@700&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #1a1a1a; 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; position: fixed; width: 100%;
            font-family: 'Roboto Mono', monospace;
        }

        /* CORPO DO CAÇA-NÍQUEL (INSPIRADO NA FOTO) */
        .slot-machine {
            width: 320px;
            background: linear-gradient(to bottom, #cf9e2e, #f9f0b1, #8c6a1b);
            border: 8px solid #222;
            border-radius: 15px 15px 40px 40px;
            position: relative;
            padding: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* LUZ DE TOPO (SIRENE) */
        .siren {
            width: 50px; height: 25px; background: #444;
            position: absolute; top: -33px; left: 50%; transform: translateX(-50%);
            border-radius: 10px 10px 0 0; border: 3px solid #111; transition: 0.3s;
        }

        .visor {
            background: white; border: 6px solid #333; border-radius: 10px;
            min-height: 380px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 15px;
        }

        h1 { font-family: 'Luckiest Guy', cursive; color: #d40000; font-size: 1.5em; margin: 0; text-align: center; }
        .subtitle { font-size: 0.5em; color: #333; font-weight: bold; margin: 5px 0 15px; text-align: center; }

        /* A ALAVANCA LATERAL REALISTA */
        .lever-base {
            position: absolute; right: -45px; top: 120px; width: 45px; height: 180px;
        }
        .lever-pivot {
            position: absolute; left: 0; bottom: 30px; width: 20px; height: 20px;
            background: #222; border-radius: 50%;
        }
        .lever-arm {
            width: 14px; height: 100px; background: linear-gradient(to right, #999, #444);
            position: absolute; bottom: 40px; left: 3px; transform-origin: bottom;
            border-radius: 5px; border: 1px solid #000;
        }
        .lever-ball {
            width: 55px; height: 55px; background: radial-gradient(circle at 30% 30%, #ff0000, #440000);
            border-radius: 50%; position: absolute; top: -50px; left: -20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); cursor: pointer;
        }

        .img-test { width: 100%; max-width: 190px; border: 4px solid #d4af37; border-radius: 8px; margin: 10px 0; }
        .btn { background: #1a1a1a; color: gold; border: 2px solid gold; padding: 10px; border-radius: 8px; width: 100%; font-family: 'Luckiest Guy'; cursor: pointer; }
        input { width: 90px; height: 45px; font-size: 1.5em; text-align: center; border: 3px solid #222; border-radius: 8px; margin-bottom: 10px; }
        .feedback { background: #fff0f0; border: 2px solid #d40000; padding: 10px; border-radius: 8px; color: #d40000; font-size: 0.7em; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="slot-machine">
    <div class="siren" id="sirene"></div>
    <div class="visor">
        <div id="tela-inicial">
            <h1>CASSINO<br>DA VISÃO</h1>
            <p class="subtitle">Teste de daltonismo com imagens Ishihara</p>
            <div style="font-size: 30px; margin-bottom: 10px;">🎰</div>

        <div id="tela-teste" class="hidden">

            </div>
        </div>

        <div id="tela-final" class="hidden">

            <div id="relatorio" style="font-size: 0.7em; margin: 15px 0;"></div>
            <button class="btn" onclick="location.reload()">RECOMEÇAR</button>
        </div>
    </div>

    <!-- SISTEMA DA ALAVANCA -->
    <div class="lever-base">

            <div class="lever-ball" id="bola"></div>
        </div>
    </div>
</div>
