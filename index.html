<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- COLOQUE SUA TAG DO GOOGLE ABAIXO -->
    <meta name="google-site-verification" content="COLE_O_SEU_CODIGO_AQUI" />
    
    <title>Cassino da Visão do Lucca</title>
    <style>
        body { 
            font-family: 'Arial Black', Gadget, sans-serif; 
            background-color: #1a1a1a; 
            color: #fff;
            text-align: center; 
            padding: 20px; 
        }
        .casino-machine { 
            max-width: 500px; 
            margin: auto; 
            background: #d4af37; /* Cor de Ouro */
            padding: 20px; 
            border: 10px solid #8b0000; 
            border-radius: 20px; 
            box-shadow: 0 0 50px #ff0000;
            position: relative;
        }
        .screen {
            background: #fff;
            color: #333;
            border: 5px solid #222;
            padding: 20px;
            border-radius: 10px;
            min-height: 300px;
        }
        h1 { color: #8b0000; text-shadow: 2px 2px #ff0000; }

        /* Estilo da Alavanca */
        .lever-container {
            position: absolute;
            right: -60px;
            top: 100px;
            width: 50px;
            height: 150px;
        }
        .lever-base {
            width: 20px;
            height: 100px;
            background: #555;
            margin: auto;
            border-radius: 10px;
            position: relative;
        }
        .lever-arm {
            width: 15px;
            height: 80px;
            background: #888;
            position: absolute;
            top: 0;
            left: 2px;
            transform-origin: bottom;
            transition: transform 0.3s;
        }
        .lever-knob {
            width: 40px;
            height: 40px;
            background: red;
            border-radius: 50%;
            position: absolute;
            top: -30px;
            left: -12px;
            cursor: pointer;
            box-shadow: 0 0 10px #000;
        }
        .lever-arm.pulled { transform: rotateX(180deg); }

        .imagem-teste { width: 100%; max-width: 250px; border: 5px solid #d4af37; border-radius: 10px; margin-top: 10px; }
        .btn-casino { 
            background: linear-gradient(#ff0000, #8b0000); 
            color: gold; 
            padding: 10px 20px; 
            border: 2px solid gold; 
            border-radius: 5px; 
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none; }
        .erro-msg { color: #fff; background-color: #8b0000; padding: 10px; border-radius: 5px; margin-top: 10px; }
        .sucesso-final { color: #ffd700; background-color: #006400; padding: 20px; border: 3px solid gold; border-radius: 10px; }
    </style>
</head>
<body>

<div class="casino-machine">
    <div class="screen">
        <!-- TELA INICIAL -->
        <div id="tela-inicial">
            <h1>CASSINO DA VISÃO</h1>
            <p>Nível: Simples (Ishihara)</p>
            <p style="font-size: 0.8em;">Puxe a alavanca para apostar na sua visão!</p>
        </div>

        <!-- TELA DO TESTE -->
        <div id="tela-teste" class="hidden">
            <h2 id="titulo-pergunta">Imagem 1</h2>
            <img id="img-ishihara" src="" class="imagem-teste">
            <br><br>
            <input type="number" id="resposta-usuario" placeholder="Número?" style="width: 60px; padding: 5px;">
            <br><br>
            <button class="btn-casino" onclick="validarPasso()">APOSTAR</button>
            <div id="feedback-erro" class="erro-msg hidden"></div>
        </div>

        <!-- TELA FINAL -->
        <div id="tela-final" class="hidden">
            <div class="sucesso-final">
                🎰 JACKPOT! 🎰<br>
                Visão Normal: Você acertou tudo!
            </div>
            <button class="btn-casino" style="margin-top:20px;" onclick="location.reload()">JOGAR DE NOVO</button>
        </div>
    </div>

    <!-- ALAVANCA -->
    <div class="lever-container" id="lever-div">
        <div class="lever-base">
            <div class="lever-arm" id="lever-arm">
                <div class="lever-knob" onclick="puxarAlavanca()"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const dadosTeste = [
        { id: 1, url: 'IMG_6395.jpeg', correto: 12, tipo: "Controle" },
        { id: 2, url: 'IMG_6396.jpeg', correto: 8, tipo: "Protanopia/Deuteranopia" },
        { id: 3, url: 'IMG_6397.gif', correto: 3, tipo: "Deuteranopia" },
        { id: 4, url: 'IMG_6398.jpeg', correto: 42, tipo: "Daltonismo Vermelho-Verde" },
        { id: 5, url: 'IMG_6399.png', correto: 74, tipo: "Protanopia Grave" },
        { id: 6, url: 'IMG_6400.jpeg', correto: 96, tipo: "Deuteranopia Grave" },
        { id: 7, url: 'IMG_6401.png', correto: 67, tipo: "Deficiência Geral" },
        { id: 8, url: 'IMG_6402.png', correto: 2, tipo: "Protanopia/Deuteranopia" }
    ];

    let indiceAtual = 0;
    let errouAlguma = false;

    function puxarAlavanca() {
        const arm = document.getElementById('lever-arm');
        arm.classList.add('pulled');
        
        setTimeout(() => {
            arm.classList.remove('pulled');
            if (indiceAtual === 0) iniciarTeste();
        }, 500);
    }

    function iniciarTeste() {
        document.getElementById('tela-inicial').classList.add('hidden');
        document.getElementById('lever-div').classList.add('hidden');
        document.getElementById('tela-teste').classList.remove('hidden');
        carregarPergunta();
    }

    function carregarPergunta() {
        const pergunta = dadosTeste[indiceAtual];
        document.getElementById('titulo-pergunta').innerText = `Sorteio ${pergunta.id}`;
        document.getElementById('img-ishihara').src = pergunta.url;
        document.getElementById('resposta-usuario').value = '';
        document.getElementById('feedback-erro').classList.add('hidden');
    }

    function validarPasso() {
        const resposta = parseInt(document.getElementById('resposta-usuario').value);
        const correto = dadosTeste[indiceAtual].correto;
        const feedback = document.getElementById('feedback-erro');

        if (resposta !== correto) {
            errouAlguma = true;
            feedback.innerHTML = `PERDEU!<br>Era ${correto}. Indicação: ${dadosTeste[indiceAtual].tipo}`;
            feedback.classList.remove('hidden');
        } else {
            avancar();
        }
    }

    function avancar() {
        indiceAtual++;
        if (indiceAtual < dadosTeste.length) {
            carregarPergunta();
        } else {
            document.getElementById('tela-teste').classList.add('hidden');
            if (!errouAlguma) {
                document.getElementById('tela-final').classList.remove('hidden');
            } else {
                alert("Fim de jogo! Você teve erros.");
                location.reload();
            }
        }
    }
</script>
</body>
</html>
