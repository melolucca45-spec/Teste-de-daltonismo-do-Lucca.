<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cassino da Visão - Lucca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Roboto+Mono:wght@700&display=swap');

        /* Trava o scroll do iPhone para a alavanca funcionar */
        html, body { 
            position: fixed; overflow: hidden; width: 100%; height: 100%; 
            margin: 0; background-color: #1a1a1a; touch-action: none; 
        }

        body { display: flex; justify-content: center; align-items: center; font-family: 'Roboto Mono', monospace; }

        .slot-machine {
            width: 310px; background: linear-gradient(to bottom, #cf9e2e, #f9f0b1, #8c6a1b);
            border: 8px solid #222; border-radius: 15px 15px 40px 40px;
            position: relative; padding: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .visor {
            background: white; border: 6px solid #333; border-radius: 10px;
            min-height: 380px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 15px; position: relative;
        }

        h1 { font-family: 'Luckiest Guy', cursive; color: #d40000; font-size: 1.5em; margin: 0; text-align: center; }
        .subtitle { font-size: 0.5em; color: #333; font-weight: bold; margin: 5px 0 15px; text-align: center; }

        /* ALAVANCA NA DIREITA (CORRIGIDA) */
        .lever-system {
            position: absolute; right: -50px; top: 100px; width: 60px; height: 200px; z-index: 999;
        }
        .lever-arm {
            width: 16px; height: 110px; background: #666; border: 2px solid #222;
            position: absolute; bottom: 40px; left: 20px; transform-origin: bottom;
            border-radius: 8px; transition: transform 0.1s;
        }
        .lever-ball {
            width: 65px; height: 65px; background: radial-gradient(circle at 30% 30%, #ff0000, #660000);
            border-radius: 50%; position: absolute; top: -55px; left: -25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); cursor: pointer;
        }

        .img-test { width: 100%; max-width: 190px; border: 4px solid #d4af37; border-radius: 8px; margin: 10px 0; }
        .btn { background: #1a1a1a; color: gold; border: 2px solid gold; padding: 12px; border-radius: 8px; width: 100%; font-family: 'Luckiest Guy'; }
        input { width: 90px; height: 50px; font-size: 1.6em; text-align: center; border: 3px solid #222; border-radius: 8px; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body scroll="no">

<div class="slot-machine">
    <div class="visor">
        <div id="tela-inicial">
            <h1>CASSINO<br>DA VISÃO</h1>
            <p class="subtitle">Teste de daltonismo - Versão 14</p>
            <div style="font-size: 40px;">🎰</div>
            <p style="color: #d40000; font-weight: bold; font-size: 0.7em; margin-top: 20px;">⬇️ PUXE A BOLA VERMELHA ⬇️</p>
        </div>

        <div id="tela-teste" class="hidden">
            <p id="label" style="font-size: 0.8em; font-weight: bold; color: #333;">IMAGEM #1</p>
            <img id="img-target" src="" class="img-test">
            <div id="input-area">
                <input type="number" id="user-input" inputmode="numeric">
                <button class="btn" onclick="validar()">VERIFICAR</button>
            </div>
        </div>

        <div id="tela-final" class="hidden">
            <h1>FIM DO TESTE</h1>
            <div id="relatorio" style="font-size: 0.75em; margin: 20px 0;"></div>
            <button class="btn" onclick="location.reload()">RECOMEÇAR</button>
        </div>
    </div>

    <!-- ALAVANCA LADO DIREITO -->
    <div class="lever-system">
        <div class="lever-arm" id="braco">
            <div class="lever-ball" id="bola"></div>
        </div>
    </div>
</div>

<script>
    const clips = [
        { url: 'IMG_6398.jpeg', res: 45 },
        { url: 'IMG_6395.jpeg', res: 12 },
        { url: 'IMG_6399.png', res: 74 },
        { url: 'IMG_6400.jpeg', res: 96 }
    ];

    let index = 0;
    let erros = [];
    const braco = document.getElementById('braco');
    const bola = document.getElementById('bola');
    let startY = 0;

    bola.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        e.preventDefault();
    }, {passive: false});

    bola.addEventListener('touchmove', (e) => {
        let currentY = e.touches[0].clientY;
        let deltaY = currentY - startY;

        if (deltaY > 0 && deltaY < 150) {
            braco.style.transform = `rotateX(${deltaY}deg)`;
        }

        if (deltaY > 130) {
            iniciarJogo();
        }
        e.preventDefault();
    }, {passive: false});

    function iniciarJogo() {
        braco.style.transform = 'rotateX(160deg)';
        setTimeout(() => {
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('tela-teste').classList.remove('hidden');
            render();
        }, 150);
    }

    function render() {
        document.getElementById('label').innerText = `IMAGEM #${index + 1}`;
        document.getElementById('img-target').src = clips[index].url;
        document.getElementById('user-input').value = '';
    }

    function validar() {
        const val = parseInt(document.getElementById('user-input').value);
        if (isNaN(val)) return;

        if (val === clips[index].res) {
            index++;
            if (index < clips.length) render();
            else finalizar();
        } else {
            erros.push({id: index + 1, exp: clips[index].res, foi: val});
            index++;
            if (index < clips.length) render();
            else finalizar();
        }
    }

    function finalizar() {
        document.getElementById('tela-teste').classList.add('hidden');
        document.getElementById('tela-final').classList.remove('hidden');
        const r = document.getElementById('relatorio');
        if (erros.length === 0) {
            r.innerHTML = "🎯 Visão perfeita! Você acertou tudo.";
        } else {
            erros.forEach(e => {
                r.innerHTML += `• Imagem ${e.id}: era ${e.exp}, você pôs ${e.foi}<br>`;
            });
        }
    }
</script>
</body>
</html>
