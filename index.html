<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cassino da Visão - Lucca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Roboto+Mono:wght@700&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0a0a0a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .slot-machine {
            width: 350px;
            background: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            border: 10px solid #222;
            border-radius: 20px 20px 60px 60px;
            position: relative;
            padding: 15px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .siren-light {
            width: 60px; height: 30px; background: #333;
            margin-top: -35px; margin-bottom: 10px;
            border-radius: 15px 15px 0 0; border: 3px solid #111;
            transition: 0.3s;
        }

        .visor-display {
            background: #ffffff; border: 6px solid #333; border-radius: 15px;
            padding: 15px; min-height: 420px; width: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
        }

        h1 { font-family: 'Luckiest Guy', cursive; color: #d40000; font-size: 1.6em; margin: 0; text-align: center; }
        .subtitle { color: #333; font-size: 0.55em; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; text-align: center; }

        /* ALAVANCA AGORA DENTRO DA MÁQUINA */
        .lever-container {
            position: absolute; right: 10px; height: 150px; width: 40px; top: 50%; transform: translateY(-50%);
        }
        .lever-arm {
            width: 12px; height: 80px; background: #888; border: 2px solid #333;
            position: absolute; bottom: 0; left: 14px; transform-origin: bottom;
            border-radius: 5px;
        }
        .lever-ball {
            width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #ff0000, #440000);
            border-radius: 50%; position: absolute; top: -45px; left: -19px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5); cursor: pointer;
        }

        .img-test { width: 100%; max-width: 200px; border: 4px solid #d4af37; border-radius: 10px; margin: 10px 0; }
        .btn-verify {
            background: #1a1a1a; color: gold; border: 2px solid gold; padding: 10px;
            border-radius: 8px; width: 100%; font-family: 'Luckiest Guy', cursive; font-size: 1em;
        }
        input[type=number] { width: 100px; height: 50px; font-size: 1.5em; text-align: center; border: 3px solid #222; border-radius: 8px; }
        .feedback-box { background: #fff0f0; border: 2px solid #d40000; padding: 10px; border-radius: 10px; color: #d40000; font-size: 0.75em; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="slot-machine">
    <div class="siren-light" id="sirene"></div>
    <div class="visor-display">
        <div id="tela-inicial">
            <h1>CASSINO<br>DA VISÃO</h1>
            <p class="subtitle">Teste de daltonismo com imagens Ishihara</p>
            <div style="font-size: 35px; margin: 10px;">🎰</div>
            <p style="color: #666; font-size: 0.6em;">[ PUXE A ALAVANCA ]</p>
            
            <div class="lever-container" id="alavanca-area">
                <div class="lever-arm" id="braco-alavanca">
                    <div class="lever-ball" id="bola-alavanca"></div>
                </div>
            </div>
        </div>

        <div id="tela-teste" class="hidden">
            <p id="label-passo" style="margin:0; font-size: 0.7em; font-weight: bold; color:#000;">IMAGEM #1</p>
            <img id="img-target" src="" class="img-test">
            <div id="area-input">
                <input type="number" id="input-user" pattern="[0-9]*" inputmode="numeric">
                <button class="btn-verify" onclick="validar()">VERIFICAR</button>
            </div>
            <div id="feedback-imediato" class="hidden feedback-box">
                <p><b>ERRO!</b></p>
                Correto era: <span id="info-correto"></span><br>
                Digitou: <span id="info-digitado"></span><br>
                <p><i><span id="info-diagnostico"></span></i></p>
                <button class="btn-verify" onclick="proxima()">PRÓXIMA ➡️</button>
            </div>
        </div>

        <div id="tela-final" class="hidden">
            <h1 id="resultado-titulo" style="color:#000;"></h1>
            <div id="relatorio-final" style="font-size: 0.7em; text-align: left; margin: 10px 0; color:#000;"></div>
            <button class="btn-verify" onclick="location.reload()">RECOMEÇAR</button>
        </div>
    </div>
</div>

<script>
    const clips = [
        { url: 'IMG_6398.jpeg', res: 45, tipo: "Daltonismo Protanopia/Deuteranopia" },
        { url: 'IMG_6395.jpeg', res: 12, tipo: "Visão Normal (Controle)" },
        { url: 'IMG_6398.jpeg', res: 42, tipo: "Daltonismo Protanopia/Deuteranopia" },
        { url: 'IMG_6399.png', res: 74, tipo: "Daltonismo Verde/Vermelho" },
        { url: 'IMG_6400.jpeg', res: 96, tipo: "Daltonismo Verde/Vermelho" },
        { url: 'IMG_6401.png', res: 67, tipo: "Daltonismo Verde/Vermelho" },
        { url: 'IMG_6402.png', res: 2, tipo: "Daltonismo Total (Acromatopsia)" }
    ];

    let currentIdx = 0;
    let listaErros = [];
    const sirene = document.getElementById('sirene');
    const braco = document.getElementById('braco-alavanca');
    const bola = document.getElementById('bola-alavanca');
    let touchY = 0;

    bola.addEventListener('touchstart', function(e) {
        touchY = e.touches[0].clientY;
        e.stopPropagation();
    }, {passive: true});

    bola.addEventListener('touchmove', function(e) {
        let diff = e.touches[0].clientY - touchY;
        if (diff > 0 && diff < 120) {
            braco.style.transform = `rotateX(${diff}deg)`;
        }
        if (diff >= 100) {
            iniciarJogo();
        }
        e.preventDefault();
    }, {passive: false});

    function iniciarJogo() {
        braco.style.transform = `rotateX(150deg)`;
        setTimeout(() => {
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('tela-teste').classList.remove('hidden');
            renderizar();
        }, 200);
    }

    function renderizar() {
        sirene.style.background = "#333";
        sirene.style.boxShadow = "none";
        document.getElementById('feedback-imediato').classList.add('hidden');
        document.getElementById('area-input').classList.remove('hidden');
        document.getElementById('label-passo').innerText = `IMAGEM #${currentIdx + 1}`;
        document.getElementById('img-target').src = clips[currentIdx].url;
        document.getElementById('input-user').value = '';
    }

    function validar() {
        const chute = parseInt(document.getElementById('input-user').value);
        if (isNaN(chute)) return;

        if (chute !== clips[currentIdx].res) {
            sirene.style.background = "#ff0000";
            sirene.style.boxShadow = "0 0 20px #ff0000";
            listaErros.push({id: currentIdx + 1, esperado: clips[currentIdx].res, real: chute});
            document.getElementById('area-input').classList.add('hidden');
            document.getElementById('feedback-imediato').classList.remove('hidden');
            document.getElementById('info-correto').innerText = clips[currentIdx].res;
            document.getElementById('info-digitado').innerText = chute;
            document.getElementById('info-diagnostico').innerText = clips[currentIdx].tipo;
        } else {
            sirene.style.background = "#00ff00";
            sirene.style.boxShadow = "0 0 20px #00ff00";
            setTimeout(proxima, 600); 
        }
    }

    function proxima() {
        currentIdx++;
        if (currentIdx < clips.length) renderizar();
        else finalizarJogo();
    }

    function finalizarJogo() {
        document.getElementById('tela-teste').classList.add('hidden');
        document.getElementById('tela-final').classList.remove('hidden');
        const tit = document.getElementById('resultado-titulo');
        const rel = document.getElementById('relatorio-final');

        if (listaErros.length === 0) {
            tit.innerText = "VISÃO NORMAL";
            tit.style.color = "#008000";
            rel.innerHTML = "🎯 Tudo certo!";
            sirene.style.background = "#00ff00";
        } else {
            tit.innerText = "CONCLUÍDO";
            tit.style.color = "#d40000";
            rel.innerHTML = "<b>Erros:</b><br>";
            listaErros.forEach(e => {
                rel.innerHTML += `• ImPutz, Lucca, que vacilo do código! Pelo seu print, a alavanca (o braço cinza) sumiu porque o comando de "congelar a tela" que eu coloquei acabou escondendo ela para fora da visualização do iPhone.

Para resolver isso de vez e não ter mais erro com alavanca sumindo ou travando, eu mudei a estratégia: agora a alavanca fica **dentro** da moldura dourada, para garantir que ela sempre apareça, e simplifiquei o código de movimento para o Safari não se confundir.
