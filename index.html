<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste de Daltonismo do Lucca</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #ffffff; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        .header h1 { font-size: 1.8em; color: #333; margin: 10px 0 25px 0; font-weight: 800; }
        .img-box { width: 100%; aspect-ratio: 1/1; background: #f2f2f2; border-radius: 20px; overflow: hidden; margin-bottom: 25px; border: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: center; }
        img { width: 100%; height: 100%; object-fit: contain; }
        input { width: 100%; padding: 18px; font-size: 1.4em; text-align: center; border: 2px solid #e0e0e0; border-radius: 15px; margin-bottom: 15px; box-sizing: border-box; color: #333; }
        .btn-check { background-color: #007bff; color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-size: 1.2em; font-weight: bold; cursor: pointer; }
        .btn-next { background-color: #28a745; color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-size: 1.2em; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .result-area { margin-top: 15px; padding: 15px; border-radius: 15px; display: none; }
        .diag-label { display: block; color: #dc3545; font-weight: bold; font-size: 1em; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="contador">Imagem #1</h1>
    </div>

    <div id="quiz-space">
        <div class="img-box">
            <img id="display-img" src="" alt="Carregando imagem...">
        </div>
        
        <div id="input-group">
            <input type="number" id="user-answer" inputmode="numeric" placeholder="Digite o número">
            <button class="btn-check" onclick="verificarResposta()">VERIFICAR</button>
        </div>

        <div id="feedback" class="result-area">
            <strong id="feedback-msg" style="font-size: 1.2em;"></strong>
            <span id="diagnostico-msg" class="diag-label"></span>
            <button class="btn-next" onclick="irParaProxima()">PRÓXIMA ➡️</button>
        </div>
    </div>

    <div id="final-screen" class="hidden">
        <h2 style="font-size: 1.8em;">Laudo Final</h2>
        <div id="summary" style="text-align: left; background: #f8f9fa; padding: 20px; border-radius: 15px; margin-bottom: 20px; line-height: 1.6;"></div>
        <button class="btn-check" onclick="location.reload()">REFAZER TESTE</button>
    </div>
</div>

<script>
    const database = [
        { img: 'image_93.png', ans: 42, info: "DEUTERANOPIA (VERDE)" },
        { img: 'image_94.png', ans: 12, info: "VISÃO NORMAL" },
        { img: 'image_96.png', ans: 45, info: "PROTANOPIA (VERMELHO)" },
        { img: 'image_99.png', ans: 74, info: "DEFICIÊNCIA VERDE/AMARELO" },
        { img: 'image_95.png', ans: 96, info: "DALTONISMO PROTAN/DEUTAN" },
        { img: 'image_100.png', ans: 67, info: "PROTANOPIA SEVERA" },
        { img: 'image_98.png', ans: 2, info: "ACROMATOPSIA (TOTAL)" }
    ];

    let currentIdx = 0;
    let score = 0;
    let failLog = [];

    function loadQuestion() {
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('input-group').style.display = 'block';
        document.getElementById('contador').innerText = "Imagem #" + (currentIdx + 1);
        
        const imgElement = document.getElementById('display-img');
        // Adicionando um timestamp para evitar problemas de cache no navegador
        imgElement.src = database[currentIdx].img + "?v=" + new Date().getTime();
        
        document.getElementById('user-answer').value = '';
    }

    function verificarResposta() {
        const input = document.getElementById('user-answer').value;
        const correct = database[currentIdx].ans.toString();
        const msg = document.getElementById('feedback-msg');
        const diag = document.getElementById('diagnostico-msg');

        document.getElementById('input-group').style.display = 'none';
        document.getElementById('feedback').style.display = 'block';

        if (input === correct) {
            score++;
            msg.innerText = "✅ CORRETO!";
            msg.style.color = "#28a745";
            diag.innerText = "";
        } else {
            failLog.push({n: currentIdx + 1, d: database[currentIdx].info});
            msg.innerText = "❌ INCORRETO!";
            msg.style.color = "#dc3545";
            diag.innerText = "DIAGNÓSTICO: " + database[currentIdx].info;
        }
    }

    function irParaProxima() {
        currentIdx++;
        if (currentIdx < database.length) {
            loadQuestion();
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById('quiz-space').classList.add('hidden');
        document.getElementById('final-screen').classList.remove('hidden');
        document.getElementById('contador').classList.add('hidden');
        const summary = document.getElementById('summary');
        let txt = "<strong>Acertos: " + score + " de " + database.length + "</strong><br><br>";
        if (failLog.length > 0) {
            txt += "<strong>Detalhes:</strong><br>";
            failLog.forEach(item => {
                txt += "• Imagem " + item.n + ": " + item.d + "<br>";
            });
        } else {
            txt += "<span style='color:green; font-weight:bold;'>Parabéns! Sua visão para cores está normal.</span>";
        }
        summary.innerHTML = txt;
    }

    loadQuestion();
</script>
</body>
</html>
