<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste de Daltonismo do Lucca</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #ffffff; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.8em; margin: 20px 0; color: #333; }
        .img-box { width: 100%; aspect-ratio: 1/1; background: #f9f9f9; border-radius: 20px; border: 1px solid #eee; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        img { width: 100%; height: 100%; object-fit: contain; }
        input { width: 100%; padding: 15px; font-size: 1.3em; text-align: center; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-blue { background-color: #007bff; color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-size: 1.1em; font-weight: bold; }
        .btn-green { background-color: #28a745; color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-size: 1.1em; font-weight: bold; margin-top: 10px; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 12px; display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titulo">Imagem #1</h1>

    <div id="jogo">
        <div class="img-box">
            <img id="foto" src="">
        </div>
        
        <div id="acao">
            <input type="number" id="campo-numero" inputmode="numeric" placeholder="Digite o número">
            <button class="btn-blue" onclick="conferir()">VERIFICAR</button>
        </div>

        <div id="resultado" class="feedback">
            <strong id="msg-topo"></strong><br>
            <span id="msg-diag" style="color: #d33; font-weight: bold; display: block; margin-top: 5px;"></span>
            <button class="btn-green" onclick="proxima()">PRÓXIMA ➡️</button>
        </div>
    </div>

    <div id="final" class="hidden">
        <h2>Resultado Final</h2>
        <div id="resumo" style="text-align: left; background: #f1f1f1; padding: 15px; border-radius: 12px;"></div>
        <button class="btn-blue" style="margin-top: 20px;" onclick="location.reload()">RECOMEÇAR</button>
    </div>
</div>

<script>
    // Lista de imagens e respostas conforme seus arquivos no GitHub
    const lista = [
        { p: 'image_93.png', r: 42, d: "DEUTERANOPIA (VERDE)" },
        { p: 'image_94.png', r: 12, d: "VISÃO NORMAL" },
        { p: 'image_96.png', r: 45, d: "PROTANOPIA (VERMELHO)" },
        { p: 'image_99.png', r: 74, d: "DEFICIÊNCIA VERDE/AMARELO" },
        { p: 'image_95.png', r: 96, d: "DALTONISMO PROTAN/DEUTAN" },
        { p: 'image_100.png', r: 67, d: "PROTANOPIA SEVERA" },
        { p: 'image_98.png', r: 2, d: "ACROMATOPSIA (TOTAL)" }
    ];

    let atual = 0, nota = 0, erros = [];

    function carregar() {
        document.getElementById('resultado').style.display = 'none';
        document.getElementById('acao').style.display = 'block';
        document.getElementById('titulo').innerText = "Imagem #" + (atual + 1);
        // O "?v=" ajuda a forçar o navegador a carregar a imagem nova
        document.getElementById('foto').src = lista[atual].p + "?v=" + Date.now();
        document.getElementById('campo-numero').value = '';
    }

    function conferir() {
        const chute = document.getElementById('campo-numero').value;
        const certo = lista[atual].r.toString();
        
        document.getElementById('acao').style.display = 'none';
        document.getElementById('resultado').style.display = 'block';

        if (chute === certo) {
            nota++;
            document.getElementById('msg-topo').innerText = "✅ VOCÊ ACERTOU!";
            document.getElementById('msg-topo').style.color = "green";
            document.getElementById('msg-diag').innerText = "";
        } else {
            erros.push({n: atual + 1, info: lista[atual].d});
            document.getElementById('msg-topo').innerText = "❌ INCORRETO!";
            document.getElementById('msg-topo').style.color = "red";
            document.getElementById('msg-diag').innerText = "DIAGNÓSTICO: " + lista[atual].d;
        }
    }

    function proxima() {
        atual++;
        if (atual < lista.length) carregar(); else finalizar();
    }

    function finalizar() {
        document.getElementById('jogo').classList.add('hidden');
        document.getElementById('titulo').classList.add('hidden');
        document.getElementById('final').classList.remove('hidden');
        let rel = "<b>Acertos: " + nota + " de " + lista.length + "</b><br><br>";
        if (erros.length > 0) {
            rel += "<b>Diagnósticos:</b><br>";
            erros.forEach(e => rel += "• Imagem " + e.n + ": " + e.info + "<br>");
        } else {
            rel += "<span style='color:green'>Sua visão está perfeita!</span>";
        }
        document.getElementById('resumo').innerHTML = rel;
    }

    carregar();
</script>
</body>
</html>
