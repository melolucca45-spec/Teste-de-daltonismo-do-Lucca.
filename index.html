<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste de Daltonismo do Lucca</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #1a1a1a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        /* Máquina com acabamento premium */
        .slot-machine {
            width: 350px;
            background: linear-gradient(145deg, #666, #222);
            border: 8px solid #111;
            border-radius: 20px 20px 50px 50px;
            position: relative;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,1);
        }

        .top-light {
            width: 50px;
            height: 25px;
            background: #ff0000;
            margin: -35px auto 10px;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 0 20px #ff0000;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Visor com FUNDO BRANCO como solicitado */
        .visor-display {
            background: #ffffff; /* Fundo branco solicitado */
            border: 10px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            color: #000;
        }

        h1 { color: #d40000; font-size: 1.4em; margin: 0; text-align: center; }
        .promo { color: #008000; font-weight: bold; margin: 5px 0; font-size: 0.9em; }

        /* Alavanca Lateral */
        .lever-system {
            position: absolute;
            right: -45px;
            top: 140px;
            width: 40px;
            height: 160px;
        }
        .lever-arm {
            width: 14px;
            height: 110px;
            background: linear-gradient(to right, #bbb, #777);
            position: absolute;
            bottom: 20px;
            left: 5px;
            transform-origin: bottom;
            touch-action: none;
            border: 1px solid #444;
        }
        .lever-ball {
            width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #ff1111, #800000);
            border-radius: 50%;
            position: absolute;
            top: -50px;
            left: -21px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
        }

        .img-test { width: 100%; max-width: 220px; border: 4px solid #333; border-radius: 5px; margin: 10px 0; }

        .btn-verify {
            background: linear-gradient(#28a745, #1e7e34);
            border: 2px solid #fff;
            color: #fff;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 10px;
            box-shadow: 0 5px #145523;
            cursor: pointer;
            width: 100%;
        }
        .btn-verify:active { transform: translateY(3px); box-shadow: 0 2px #145523; }

        input[type=number] {
            width: 100px;
            height: 50px;
            font-size: 1.8em;
            text-align: center;
            border: 4px solid #d4af37;
            border-radius: 10px;
            background: #fff;
            color: #000;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="slot-machine">
    <div class="top-light"></div>
    <div class="visor-display">
        
        <div id="tela-inicial">
            <h1>CASSINO DA VISÃO</h1>
            <p class="promo">VALE UM JACKPOT?</p>
            <p style="color: #333; font-size: 0.8em; margin-top: 50px;">⬇️ PUXE PARA COMEÇAR</p>
        </div>

        <div id="tela-teste" class="hidden">
            <p id="info-topo" style="margin:0; font-weight:bold; font-size: 0.7em;">TESTE DE ISHIHARA</p>
            <img id="img-atual" src="" class="img-test">
            <br>
            <input type="number" id="campo-resposta" pattern="\[0-9\]*" inputmode="numeric">
            <br><br>
            <button class="btn-verify" onclick="validar()">VERIFICAR</button>
        </div>

        <div id="tela-final" class="hidden" style="text-align:center;">
            <h1 style="color: gold;">🎰 JACKPOT!</h1>
            <p>VISÃO PERFEITA!</p>
            <button class="btn-verify" style="background:#007bff;" onclick="location.reload()">NOVO JOGO</button>
        </div>

    </div>

    <div class="lever-system" id="box-alavanca">
        <div class="lever-arm" id="braco">
            <div class="lever-ball" id="bola"></div>
        </div>
    </div>
</div>

<script>
    // Respostas validadas conforme suas imagens
    const clips = [
        { url: 'IMG_6395.jpeg', res: 12 }, { url: 'IMG_6396.jpeg', res: 8 },
        { url: 'IMG_6397.gif', res: 3 }, { url: 'IMG_6398.jpeg', res: 42 },
        { url: 'IMG_6399.png', res: 74 }, { url: 'IMG_6400.jpeg', res: 96 },
        { url: 'IMG_6401.png', res: 67 }, { url: 'IMG_6402.png', res: 2 }
    ];

    let atual = 0;
    let errou = false;
    const braco = document.getElementById('braco');
    const bola = document.getElementById('bola');
    let inicialY = 0;

    bola.addEventListener('touchstart', (e) => { inicialY = e.touches[0].clientY; e.preventDefault(); }, {passive: false});
    bola.addEventListener('touchmove', (e) => {
        let movimento = e.touches[0].clientY - inicialY;
        if (movimento > 0 && movimento < 140) braco.style.transform = `rotateX(${movimento}deg)`;
        if (movimento >= 130) iniciar();
        e.preventDefault();
    }, {passive: false});

    bola.addEventListener('touchend', () => { if (atual === 0) braco.style.transform = `rotateX(0deg)`; });

    function iniciar() {
        braco.style.transform = `rotateX(150deg)`;
        setTimeout(() => {
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('box-alavanca').classList.add('hidden');
            document.getElementById('tela-teste').classList.remove('hidden');
            mostrar();
        }, 300);
    }

    function mostrar() {
        document.getElementById('img-atual').src = clips[atual].url;
        document.getElementById('campo-resposta').value = '';
        document.getElementById('campo-resposta').focus();
    }

    function validar() {
        const resp = parseInt(document.getElementById('campo-resposta').value);
        if (isNaN(resp)) return;

        // Validação rigorosa dos números
        if (resp !== clips[atual].res) {
            errou = true;
        }

        atual++;
        if (atual < clips.length) {
            mostrar();
        } else {
            document.getElementById('tela-teste').classList.add('hidden');
            if (!errou) {
                document.getElementById('tela-final').classList.remove('hidden');
            } else {
                alert("TESTE FINALIZADO! VOCÊ TEVE ERROS NA IDENTIFICAÇÃO.");
                location.reload();
            }
        }
    }
</script>
</body>
</html>
