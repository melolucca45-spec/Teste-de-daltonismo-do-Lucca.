<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Daltonismo do Lucca</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        img { max-width: 300px; border-radius: 10px; margin-bottom: 20px; }
        input { padding: 10px; width: 80px; font-size: 16px; }
        button { padding: 10px 20px; background: black; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="teste-container">
        <h1>Teste de Daltonismo do Lucca</h1>
        <img id="imagem-teste" src="IMG_6395.jpeg">
        <br>
        <input type="number" id="respostaUsuario" placeholder="Número">
        <br><br>
        <button onclick="verificarResposta()">Verificar</button>
    </div>

    <script>
        let etapa = 0;
        const imagens = ["IMG_6395.jpeg", "IMG_6396.jpeg", "IMG_6397.jpeg", "IMG_6398.jpeg", "IMG_6399.png", "IMG_6400.jpeg", "IMG_6401.jpeg", "IMG_6402.jpeg"];

        function verificarResposta() {
            etapa++;
            if (etapa < imagens.length) {
                document.getElementById("imagem-teste").src = imagens[etapa];
                document.getElementById("respostaUsuario").value = "";
            } else {
                document.getElementById("teste-container").innerHTML = `
                    <h2>Teste Finalizado!</h2>
                    <p>O teste indica possíveis sinais de: <b>Daltonismo Vermelho/Verde</b>.</p>
                    <button onclick="location.reload()">Refazer Teste</button>
                `;
            }
        }
    </script>
</body>
</html>
