<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Daltonismo do Lucca</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        #teste-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 95%; }
        img { max-width: 100%; height: auto; border-radius: 10px; margin-bottom: 20px; border: 2px solid #ddd; background-color: #eee; min-height: 200px; }
        input { padding: 12px; width: 100px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
        button { padding: 12px 25px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .erro-item { color: #d93025; margin-bottom: 15px; text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="teste-container">
        <h1>Teste de Daltonismo do Lucca</h1>
        <div id="conteudo">
            <img id="imagem-teste" src="IMG_6395.jpeg">
            <br>
            <input type="number" id="respostaUsuario" placeholder="Número">
            <br>
            <button onclick="verificarResposta()">Verificar</button>
        </div>
    </div>

    <script>
        let etapa = 0;
        // SINCRONIZADO: Imagem correta com o número correto
        const dadosTeste = [
            { img: "IMG_6395.jpeg", correto: 12, tipo: "Controle (Normal)" },
            { img: "IMG_6396.jpeg", correto: 8,  tipo: "Protanopia (Dificuldade com Vermelho)" },
            { img: "IMG_6397.gif",  correto: 5,  tipo: "Deuteranopia (Dificuldade com Verde)" },
            { img: "IMG_6398.jpeg", correto: 29, tipo: "Daltonismo Vermelho-Verde" },
            { img: "IMG_6399.png",  correto: 74, tipo: "Protanopia Grave" },
            { img: "IMG_6400.jpeg", correto: 7,  tipo: "Deuteranopia Grave" },
            { img: "IMG_6401.png",  correto: 45, tipo: "Deficiência Geral" },
            { img: "IMG_6402.png",  correto: 2,  tipo: "Protanopia/Deuteranopia" }
        ];

        let errosCometidos = [];

        function verificarResposta() {
            const campo = document.getElementById("respostaUsuario");
            const respostaDigitada = parseInt(campo.value);
            
            // Verifica se está certo antes de passar para a próxima
            if (respostaDigitada !== dadosTeste[etapa].correto) {
                errosCometidos.push({
                    imagem: dadosTeste[etapa].img,
                    numeroCerto: dadosTeste[etapa].correto,
                    seuNumero: campo.value || "Vazio",
                    deficiencia: dadosTeste[etapa].tipo
                });
            }

            etapa++;

            if (etapa < dadosTeste.length) {
                document.getElementById("imagem-teste").src = dadosTeste[etapa].img;
                campo.value = "";
            } else {
                exibirResultado();
            }
        }

        function exibirResultado() {
            let res = "<h2>Resultado Final</h2>";
            if (errosCometidos.length === 0) {
                res += "<p style='color:green; font-weight:bold;'>Parabéns! Você acertou tudo.</p>";
            } else {
                res += "<p>O sistema detectou erros de percepção:</p>";
                errosCometidos.forEach(item => {
                    res += `<div class='erro-item'>
                        <b>Imagem:</b> ${item.imagem}<br>
                        <b>Correto:</b> ${item.numeroCerto} | <b>Você viu:</b> ${item.seuNumero}<br>
                        <b>Tipo:</b> ${item.deficiencia}</div>`;
                });
            }
            document.getElementById("conteudo").innerHTML = res + "<br><button onclick='location.reload()'>Reiniciar</button>";
        }
    </script>
</body>
</html>
