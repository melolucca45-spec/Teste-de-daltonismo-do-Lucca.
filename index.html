            background-color: #0a0a0a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Roboto Mono', monospace;
        }

        .slot-machine {
            width: 360px;
            background: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            border: 10px solid #222;
            border-radius: 20px 20px 60px 60px;
            position: relative;
            padding: 15px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.5);
        }

        .siren-light {
            width: 60px; height: 35px; background: #333;
            margin: -45px auto 10px; border-radius: 20px 20px 0 0;
            border: 4px solid #111; transition: 0.3s;
        }

        .visor-display {
            background: #ffffff; border: 8px solid #333; border-radius: 15px;
            padding: 20px; min-height: 440px; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }

        h1 { font-family: 'Luckiest Guy', cursive; color: #d40000; font-size: 1.8em; margin: 0; text-align: center; }
        .subtitle { color: #333; font-size: 0.6em; font-weight: bold; margin-top: 5px; text-transform: uppercase; text-align: center; }

        /* Área da Alavanca com Z-index alto */
        .lever-system { position: absolute; right: -55px; top: 150px; width: 60px; height: 200px; z-index: 999; }
        .lever-arm {
            width: 16px; height: 120px; background: linear-gradient(to right, #ddd, #888);
            position: absolute; bottom: 20px; left: 15px; transform-origin: bottom;
            border: 2px solid #444; border-radius: 10px;
        }
        .lever-ball {
            width: 65px; height: 65px; background: radial-gradient(circle at 30% 30%, #ff0000, #440000);
            border-radius: 50%; position: absolute; top: -55px; left: -25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7); cursor: pointer;
        }

        .img-test { width: 100%; max-width: 230px; border: 5px solid #d4af37; border-radius: 10px; margin: 10px 0; }
        .btn-verify {
            background: #1a1a1a; color: gold; border: 2px solid gold; padding: 12px;
            border-radius: 10px; width: 100%; font-family: 'Luckiest Guy', cursive;
        }
        input[type=number] { width: 120px; height: 60px; font-size: 2em; text-align: center; border: 4px solid #222; border-radius: 10px; }
        .feedback-box { background: #fff0f0; border: 2px solid #d40000; padding: 15px; border-radius: 10px; color: #d40000; font-size: 0.8em; text-align: center; }
        .hidden { display: none !important; }
    </style>

<body>

<div class="slot-machine">
    <div class="siren-light" id="sirene"></div>

        <div id="tela-inicial">
            <h1>CASSINO<br>DA VISÃO</h1>
            <p class="subtitle">Teste de daltonismo com imagens Ishihara</p>
            <div style="font-size: 40px; margin: 15px;">🎰</div>
            <p style="color: #666; font-size: 0.7em;">[ PUXE A BOLA VERMELHA ]</p>
        </div>

        <div id="tela-teste" class="hidden">
            <p id="label-passo" style="margin:0; font-size: 0.7em; font-weight: bold; color:#000;">IMAGEM #1</p>
            <img id="img-target" src="" class="img-test">
            <div id="area-input">
                <input type="number" id="input-user" pattern="[0-9]*" inputmode="numeric">
                <button class="btn-verify" onclick="validar()">VERIFICAR</button>
            </div>
            <div id="feedback-imediato" class="hidden feedback-box">

                <p><i><span id="info-diagnostico"></span></i></p>
                <button class="btn-verify" onclick="proxima()">CONTINUAR ➡️</button>
            </div>
        </div>

        <div id="tela-final" class="hidden">
            <h1 id="resultado-titulo" style="color:#000;"></h1>
            <div id="relatorio-final" style="font-size: 0.7em; text-align: left; margin: 15px 0; color:#000;"></div>

        </div>
    </div>

    </div>

    const bola = document.getElementById('bola-alavanca');
    let touchY = 0;

    bola.addEventListener('touchstart', function(e) {
        touchY = e.touches[0].clientY;
        e.preventDefault(); 
    }, {passive: false});

        let diff = e.touches[0].clientY - touchY;
        if (diff > 0 && diff < 150) {
            braco.style.transform = `rotateX(${diff}deg)`;
        }
        if (diff >= 130) {
            iniciarJogo();
        }
        e.preventDefault(); 
    }, {passive: false});

    function iniciarJogo() {
        braco.style.transform = `rotateX(150deg)`;
        setTimeout(() => {
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('alavanca-container').classList.add('hidden');
            document.getElementById('tela-teste').classList.remove('hidden');
            renderizar();
        }, 200);
    }

    function renderizar() {
        sirene.style.background = "#333";
        sirene.style.boxShadow = "none";
        document.getElementById('feedback-imediato').classList.add('hidden');
        document.getElementById('area-input').classList.remove('hidden');
        document.getElementById('label-passo').innerText = `IMAGEM #${currentIdx + 1}`;
        document.getElementById('img-target').src = clips[currentIdx].url;
        document.getElementById('input-user').value = '';
    }

    function validar() {
        const chute = parseInt(document.getElementById('input-user').value);
        if (isNaN(chute)) return;

        if (chute !== clips[currentIdx].res) {
            sirene.style.background = "#ff0000";
            sirene.style.boxShadow = "0 0 30px #ff0000";
            listaErros.push({id: currentIdx + 1, esperado: clips[currentIdx].res, real: chute});
            document.getElementById('area-input').classList.add('hidden');
            document.getElementById('feedback-imediato').classList.remove('hidden');
            document.getElementById('info-correto').innerText = clips[currentIdx].res;
            document.getElementById('info-digitado').innerText = chute;
            document.getElementById('info-diagnostico').innerText = `Indicativo de: ${clips[currentIdx].tipo}`;
        } else {
            sirene.style.background = "#00ff00";
            sirene.style.boxShadow = "0 0 30px #00ff00";
            setTimeout(proxima, 800); 
        }
    }

    function proxima() {
        currentIdx++;
        if (currentIdx < clips.length) renderizar();
        else finalizarJogo();
    }

    function finalizarJogo() {
        document.getElementById('tela-teste').classList.add('hidden');
        document.getElementById('tela-final').classList.remove('hidden');
        const tit = document.getElementById('resultado-titulo');
        const rel = document.getElementById('relatorio-final');

        if (listaErros.length === 0) {
            tit.innerText = "VISÃO NORMAL";
            tit.style.color = "#008000";
            rel.innerHTML = "🎯 Você passou no teste sem nenhum erro!";
            sirene.style.background = "#00ff00";
        } else {
            tit.innerText = "TESTE CONCLUÍDO";
            tit.style.color = "#d40000";
