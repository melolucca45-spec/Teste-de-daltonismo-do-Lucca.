<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste de Daltonismo do Lucca</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f0f0; margin: 0; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .siren { width: 100px; height: 40px; background: #444; border-radius: 20px 20px 0 0; margin: 0 auto 10px; border: 3px solid #222; }
        img { width: 100%; border-radius: 10px; margin-bottom: 15px; border: 2px solid #ddd; }
        input { width: 80%; padding: 12px; font-size: 1.2em; text-align: center; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
        .btn { background-color: #28a745; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .feedback { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; }
        .diag-text { color: #d40000; font-weight: bold; margin-top: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="siren" id="sirene"></div>
    <div id="tela-teste">
        <h2 id="titulo">Imagem #1</h2>
        <img id="imagem" src="">
        <div id="controle">
            <input type="number" id="resposta" inputmode="numeric" placeholder="Qual número você vê?">
            <button class="btn" onclick="verificar()">VERIFICAR</button>
        </div>
        <div id="resultado" class="feedback">
            <p id="status-texto"></p>
            <p id="diagnostico" class="diag-text"></p>
            <button class="btn" style="background-color: #007bff; margin-top: 10px;" onclick="proxima()">PRÓXIMA ➡️</button>
        </div>
    </div>

    <div id="tela-final" class="hidden">
        <h2>Laudo Final</h2>
        <div id="relatorio" style="text-align: left; font-size: 0.9em; margin-bottom: 20px;"></div>
        <button class="btn" onclick="location.reload()">REINICIAR TESTE</button>
    </div>
</div>

<script>
    const clips = [
        { url: 'image_93.png', res: 42, def: "DEUTERANOPIA (VERDE)" },
        { url: 'image_94.png', res: 12, def: "VISÃO NORMAL" },
        { url: 'image_96.png', res: 45, def: "PROTANOPIA (VERMELHO)" },
        { url: 'image_99.png', res: 74, def: "DEFICIÊNCIA VERDE/AMARELO" },
        { url: 'image_95.png', res: 96, def: "DALTONISMO PROTAN/DEUTAN" },
        { url: 'image_100.png', res: 67, def: "PROTANOPIA SEVERA" },
        { url: 'image_98.png', res: 2, def: "ACROMATOPSIA (TOTAL)" }
    ];

    let index = 0, acertos = 0, erros = [];

    function render() {
        document.getElementById('sirene').style.background = '#444';
        document.getElementById('sirene').style.boxShadow = 'none';
        document.getElementById('resultado').style.display = 'none';
        document.getElementById('controle').style.display = 'block';
        document.getElementById('titulo').innerText = "Imagem #" + (index + 1);
        document.getElementById('imagem').src = clips[index].url;
        document.getElementById('resposta').value = '';
    }

    function verificar() {
        const userVal = document.getElementById('resposta').value;
        const correctVal = clips[index].res.toString();
        const status = document.getElementById('status-texto');
        const diag = document.getElementById('diagnostico');
        const siren = document.getElementById('sirene');

        document.getElementById('controle').style.display = 'none';
        document.getElementById('resultado').style.display = 'block';

        if (userVal === correctVal) {
            acertos++;
            siren.style.background = '#28a745';
            siren.style.boxShadow = '0 0 15px #28a745';
            status.innerText = "✅ VOCÊ ACERTOU!";
            status.style.color = "green";
            diag.innerText = "";
        } else {
            erros.push({id: index + 1, causa: clips[index].def});
            siren.style.background = '#d40000';
            siren.style.boxShadow = '0 0 15px #d40000';
            status.innerText = "❌ ERRO DETECTADO!";
            status.style.color = "red";
            diag.innerText = "DIAGNÓSTICO: " + clips[index].def;
        }
    }

    function proxima() {
        index++;
        if (index < clips.length) render(); else finalizar();
    }

    function finalizar() {
        document.getElementById('tela-teste').classList.add('hidden');
        document.getElementById('tela-final').classList.remove('hidden');
        const rel = document.getElementById('relatorio');
        let html = "<b>Acertos: " + acertos + "/" + clips.length + "</b><br><br>";
        if (erros.length > 0) {
            html += "<b>Diagnósticos por imagem:</b><br>";
            erros.forEach(e => html += "• Imagem " + e.id + ": " + e.causa + "<br>");
        } else {
            html += "<span style='color:green'>Sua visão parece normal para cores!</span>";
        }
        rel.innerHTML = html;
    }

    render();
</script>
</body>
</html>
