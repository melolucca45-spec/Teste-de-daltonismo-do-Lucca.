<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- COLOQUE SUA TAG DO GOOGLE ABAIXO -->
    <meta name="google-site-verification" content="COLE_O_SEU_CODIGO_AQUI" />
    
    <title>Teste de Daltonismo do Lucca</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .btn-comecar { background-color: #28a745; color: white; padding: 15px 40px; border: none; border-radius: 30px; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .btn-comecar:hover { background-color: #218838; transform: scale(1.05); }
        .imagem-teste { width: 100%; max-width: 300px; border-radius: 10px; margin-bottom: 20px; }
        .erro-msg { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 8px; margin-top: 10px; text-align: left; }
        .sucesso-final { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 20px; border-radius: 10px; font-weight: bold; font-size: 1.2em; }
        .hidden { display: none; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-proximo { background-color: #007bff; color: white; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- TELA INICIAL -->
    <div id="tela-inicial">
        <h1>Teste de Visão - Nível Simples</h1>
        <p>Utilizando imagens de Ishihara para detecção de daltonismo.</p>
        <button class="btn-comecar" onclick="iniciarTeste()">COMEÇAR TESTE</button>
    </div>

    <!-- TELA DO TESTE -->
    <div id="tela-teste" class="hidden">
        <h2 id="titulo-pergunta">Imagem 1</h2>
        <img id="img-ishihara" src="" class="imagem-teste" alt="Imagem de Ishihara">
        <br>
        <input type="number" id="resposta-usuario" placeholder="Que número você vê?">
        <br>
        <button class="btn-proximo" onclick="validarPasso()">Confirmar</button>
        
        <!-- MENSAGEM DE ERRO IMEDIATA -->
        <div id="feedback-erro" class="erro-msg hidden"></div>
    </div>

    <!-- TELA FINAL DE SUCESSO -->
    <div id="tela-final" class="hidden">
        <div class="sucesso-final">
            ✅ Visão Normal: Todas as imagens foram acertadas corretamente!
        </div>
        <button class="btn-proximo" style="margin-top:20px;" onclick="location.reload()">Refazer Teste</button>
    </div>
</div>

<script>
    const dadosTeste = [
        { id: 1, url: 'link_da_imagem_1.jpg', correto: 12, tipo: "Controle (Todos enxergam)" },
        { id: 2, url: 'link_da_imagem_2.jpg', correto: 8, tipo: "Protanopia/Deuteranopia" },
        { id: 3, url: 'link_da_imagem_3.jpg', correto: 3, tipo: "Deuteranopia" },
        { id: 4, url: 'link_da_imagem_4.jpg', correto: 42, tipo: "Daltonismo Vermelho-Verde" },
        { id: 5, url: 'link_da_imagem_5.jpg', correto: 74, tipo: "Protanopia Grave" },
        { id: 6, url: 'link_da_imagem_6.jpg', correto: 96, tipo: "Deuteranopia Grave" },
        { id: 7, url: 'link_da_imagem_7.jpg', correto: 67, tipo: "Deficiência Geral" }
    ];

    let indiceAtual = 0;
    let errouAlguma = false;

    function iniciarTeste() {
        document.getElementById('tela-inicial').classList.add('hidden');
        document.getElementById('tela-teste').classList.remove('hidden');
        carregarPergunta();
    }

    function carregarPergunta() {
        const pergunta = dadosTeste[indiceAtual];
        document.getElementById('titulo-pergunta').innerText = `Imagem ${pergunta.id}`;
        document.getElementById('img-ishihara').src = pergunta.url;
        document.getElementById('resposta-usuario').value = '';
        document.getElementById('feedback-erro').classList.add('hidden');
    }

    function validarPasso() {
        const resposta = parseInt(document.getElementById('resposta-usuario').value);
        const correto = dadosTeste[indiceAtual].correto;
        const feedback = document.getElementById('feedback-erro');

        if (resposta !== correto) {
            errouAlguma = true;
            feedback.innerHTML = `
                <b>[ERRO]</b><br>
                Você digitou: ${resposta}<br>
                O número real era: ${correto}<br>
                Indicação: ${dadosTeste[indiceAtual].tipo}
            `;
            feedback.classList.remove('hidden');
            // Não avança se errar, ou você pode decidir se ele continua mesmo errando.
        } else {
            avancar();
        }
    }

    function avancar() {
        indiceAtual++;
        if (indiceAtual < dadosTeste.length) {
            carregarPergunta();
        } else {
            finalizar();
        }
    }

    function finalizar() {
        document.getElementById('tela-teste').classList.add('hidden');
        if (!errouAlguma) {
            document.getElementById('tela-final').classList.remove('hidden');
        } else {
            alert("Teste finalizado. Verifique os erros apontados durante o percurso.");
            location.reload();
        }
    }
</script>

</body>
</html>
